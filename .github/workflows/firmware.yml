name: Build firmware
run-name: Firmware ${{ inputs.request_id || 'reference' }} · ${{ inputs.mode || 'via' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Firmware mode (Planck rev6 or Urchin)
        type: choice
        options: [via, vial, qmk, zmk]
        default: via
      project:
        description: Magic Keys project JSON (blank uses reference preset)
        type: string
        default: ''
      request_id:
        description: Build identifier
        type: string
        default: reference
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Validate and generate
        env:
          MK_MODE: ${{ inputs.mode }}
          MK_PROJECT: ${{ inputs.project }}
        run: node scripts/generate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: generated-source
          path: generated
          include-hidden-files: true
          retention-days: 1
  compile:
    if: inputs.mode != 'zmk'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: qmkfm/qmk_cli
    steps:
      - name: Check out pinned QMK
        if: inputs.mode != 'vial'
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: 08c662f286ddfd12a985f57b584b02eca5af0ae6
          submodules: recursive
      - name: Check out pinned Vial
        if: inputs.mode == 'vial'
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: generated-source
          path: generated
      - name: Install keymap
        run: |
          mkdir -p keyboards/planck/rev6/keymaps
          cp -R generated/keyboards/planck/rev6/keymaps/* keyboards/planck/rev6/keymaps/
      - name: Compile QMK and VIA
        if: inputs.mode != 'vial'
        run: QMK_HOME="$PWD" qmk compile -kb planck/rev6 -km magic_keys
      - name: Compile Vial
        if: inputs.mode == 'vial'
        run: QMK_HOME="$PWD" qmk compile -kb planck/rev6 -km vial
      - name: Record checksums
        run: sha256sum ./*.bin > firmware-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: planck-rev6-${{ inputs.mode }}-flash
          path: |
            ./*.bin
            firmware-sha256.txt
            generated/magic-keys.json
            generated/README.md
          if-no-files-found: error
          retention-days: 3

  compile-zmk:
    if: inputs.mode == 'zmk'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        side: [left, right]
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated-source
          path: generated
      - name: Initialize pinned ZMK workspace
        run: |
          west init -l generated/config
          cd generated
          west update
          west zephyr-export
      - name: Compile Urchin
        env:
          SIDE: ${{ matrix.side }}
        run: |
          cd generated
          west build -s zmk/app -b nice_nano_v2 -d build -- -DZMK_CONFIG="$PWD/config" -DSHIELD="urchin_${SIDE}"
          cp build/zephyr/zmk.uf2 "urchin-${SIDE}-nice-nano-v2.uf2"
          sha256sum ./*.uf2 > firmware-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: urchin-${{ matrix.side }}-flash
          path: |
            generated/*.uf2
            generated/firmware-sha256.txt
            generated/magic-keys.json
            generated/README.md
          if-no-files-found: error
          retention-days: 3
